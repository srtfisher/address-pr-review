name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed build matches the source
        run: |
          if [ -n "$(git status --porcelain -- skills/address-pr-review/app)" ]; then
            git status --short -- skills/address-pr-review/app
            echo "::error::skills/address-pr-review/app is out of date. Run npm run build and commit the result."
            exit 1
          fi
